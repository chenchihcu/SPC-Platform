# Machine verification baseline: qt audit + lint + full app type check + tests + launch check
name: ci-quality

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt runtime system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Diagnose Qt shared-library deps (temporary)
        run: |
          QT_DIR=$(python -c "import PySide6, os; print(os.path.dirname(PySide6.__file__))")
          for f in "$QT_DIR"/Qt/lib/libQt6Core.so.6 "$QT_DIR"/Qt/lib/libQt6Gui.so.6 "$QT_DIR"/Qt/lib/libQt6Widgets.so.6 "$QT_DIR"/Qt/plugins/platforms/libqoffscreen.so "$QT_DIR"/QtGui.abi3.so "$QT_DIR"/QtWidgets.abi3.so; do
            echo "== $f"; ldd "$f" | grep "not found" || true
          done
          python -c "from PySide6.QtWidgets import QApplication; app = QApplication([]); print('QApplication OK', app.platformName())"

      - name: Run lint
        run: python -m ruff check .

      - name: Run type check (full app)
        run: python -m mypy app

      - name: Run tests
        run: python -m pytest -q

      - name: Run Qt UI audit
        run: python scripts/qt_audit.py app/

      - name: Run launch check
        run: python scripts/check_launch.py

      # Release script + release_report.json schema (release_validation + ext traceability).
      # Skip ruff/mypy here; prior steps already ran them.
      - name: Release check (script + JSON, with release ext)
        run: python scripts/release_check.py --skip-ruff --skip-mypy --with-release-ext
